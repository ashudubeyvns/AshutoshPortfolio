name: Publish Ashutosh Portfolio
on:
  push:
    branches: [ashutosh-sushmita-inspired]
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - id: deployment
        uses: actions/deploy-pages@v4

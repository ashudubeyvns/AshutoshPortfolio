<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="t">
<title id="t">Thanks for visiting</title>
<defs><linearGradient id="g"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
<rect width="1200" height="130" rx="18" fill="#0b1220"/>
<path d="M0 0H1200" stroke="url(#g)" stroke-width="3">
<animate attributeName="stroke-dasharray" values="0 1200;600 600;1200 0;0 1200" dur="6s" repeatCount="indefinite"/>
</path>
<g font-family="ui-monospace,monospace" text-anchor="middle">
<text x="600" y="56" fill="#e2e8f0" font-size="24" font-weight="700">THANKS FOR STOPPING BY</text>
<text x="600" y="85" fill="#7dd3fc" font-size="14" letter-spacing="3">LET'S BUILD SOMETHING MEANINGFUL</text>
</g>
<circle cx="110" cy="65" r="3" fill="#38bdf8"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="1090" cy="65" r="3" fill="#c084fc"><animate attributeName="opacity" values="1;.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>